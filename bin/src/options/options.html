<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Channel Blocker settings</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main id="app" class="app"></main>

    <template id="gate-template">
      <section class="card gate">
        <p class="eyebrow">Channel Blocker</p>
        <h1>Settings are locked</h1>
        <p class="lede">
          Type the <strong id="gate-length">32</strong> characters below to change the blocked list.
          Case and spaces do not matter. The code is drawn as an image so it cannot be copied and pasted.
        </p>
        <div class="captcha-wrap">
          <canvas
            id="gate-canvas"
            class="captcha"
            role="img"
            aria-label="Image containing the unlock code. Use the New code button if it is unreadable."
          ></canvas>
        </div>
        <form id="gate-form" novalidate>
          <label for="gate-input" class="sr-only">Unlock code</label>
          <input
            id="gate-input"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Type the code"
          >
          <div class="row">
            <button type="submit" class="primary" id="gate-submit">Unlock</button>
            <button type="button" class="ghost" id="gate-new">New code</button>
          </div>
          <p id="gate-msg" class="msg" role="status" aria-live="polite"></p>
        </form>
        <p class="hint">
          There is intentionally no reset. If you are locked out, remove the extension in
          chrome://extensions, or wait for the cooldown.
        </p>
      </section>
    </template>

    <template id="settings-template">
      <div class="shell">
      <nav class="sidebar" aria-label="Settings sections">
        <p class="side-title">Channel Blocker</p>
        <button type="button" class="side-item" data-nav="behavior">YouTube behavior</button>
        <button type="button" class="side-item" data-nav="blocker">Channel blocker</button>
        <button type="button" class="side-item" data-nav="options">Extension options</button>
      </nav>
      <div class="content">
      <div class="panel" data-panel="blocker">

      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">Profile settings</p>
            <h1 id="profile-title">Profile</h1>
          </div>
          <div class="lockbox">
            <span id="lock-timer" class="timer">Locks in 0:00</span>
            <button type="button" class="ghost" id="lock-now">Lock now</button>
          </div>
        </header>

        <div class="profile-tabs-row">
          <div id="profile-tabs" class="profile-tabs" role="tablist" aria-label="Profiles"></div>
        </div>

        <form id="profile-edit-form" class="profile-edit" novalidate>
          <div class="field">
            <label for="profile-name">Profile name</label>
            <div class="row">
              <input id="profile-name" type="text" maxlength="60" autocomplete="off" spellcheck="false">
              <button type="submit" class="primary" id="profile-update">Update</button>
            </div>
          </div>
        </form>

        <h2>What this profile blocks</h2>
        <div class="surface-grid">
          <label class="toggle"><input type="checkbox" id="opt-home"><span>Home feed</span></label>
          <label class="toggle"><input type="checkbox" id="opt-search"><span>Search results</span></label>
          <label class="toggle"><input type="checkbox" id="opt-shorts"><span>Shorts</span></label>
          <label class="toggle"><input type="checkbox" id="opt-channelPage"><span>Channel pages</span></label>
          <label class="toggle"><input type="checkbox" id="opt-playback"><span>Video playback</span></label>
        </div>

        <div class="profile-danger">
          <label class="toggle">
            <input type="checkbox" id="profile-enabled">
            <span>Active (applies to YouTube right now)</span>
          </label>
          <button type="button" class="ghost danger" id="profile-delete">Delete profile</button>
        </div>
      </section>

      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">Channel Blocker</p>
            <h1>Channels in <span id="channels-profile-name">…</span></h1>
          </div>
        </header>

        <form id="add-form" class="add" novalidate>
          <label for="add-input">Channel handle, channel URL, channel ID, or exact channel name</label>
          <div class="row">
            <input
              id="add-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="@handle or https://www.youtube.com/@handle"
            >
            <button type="submit" class="primary">Add</button>
          </div>
          <p id="add-msg" class="msg" role="status" aria-live="polite"></p>
        </form>

        <ul id="list" class="list" aria-label="Blocked channels"></ul>
        <p id="list-empty" class="empty">No channels are blocked in this profile yet.</p>
      </section>

      </div>

      <div class="panel" data-panel="behavior" hidden>
      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">YouTube behavior</p>
            <h1>Watch page</h1>
          </div>
          <label class="toggle group-toggle">
            <span>Section:</span>
            <select id="group-select-watch" class="group-select" aria-label="Watch page section state">
              <option value="all-on">All on</option>
              <option value="all-off">All off</option>
              <option value="custom" disabled>Custom</option>
            </select>
          </label>
        </header>
        <p class="lede-small">
          Clean up the parts of YouTube you never asked for. Everything here is off by default;
          each toggle applies on its own. Toggles live in three groups: this card covers the watch
          page, the next covers home and search, and the third covers the sidebar and navigation.
        </p>
        <ul id="behavior-list-watch" class="behavior-list" aria-label="Watch page toggles"></ul>
      </section>

      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">YouTube behavior</p>
            <h1>Home and search</h1>
          </div>
          <label class="toggle group-toggle">
            <span>Section:</span>
            <select id="group-select-home" class="group-select" aria-label="Home and search section state">
              <option value="all-on">All on</option>
              <option value="all-off">All off</option>
              <option value="custom" disabled>Custom</option>
            </select>
          </label>
        </header>
        <ul id="behavior-list-home" class="behavior-list" aria-label="Home and search toggles"></ul>
      </section>

      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">YouTube behavior</p>
            <h1>Sidebar and navigation</h1>
          </div>
          <label class="toggle group-toggle">
            <span>Section:</span>
            <select id="group-select-nav" class="group-select" aria-label="Sidebar and navigation section state">
              <option value="all-on">All on</option>
              <option value="all-off">All off</option>
              <option value="custom" disabled>Custom</option>
            </select>
          </label>
        </header>
        <ul id="behavior-list-nav" class="behavior-list" aria-label="Sidebar and navigation toggles"></ul>
      </section>
      </div>

      <div class="panel" data-panel="options" hidden>
      <section class="card">
        <header class="head">
          <div>
            <p class="eyebrow">Extension options</p>
            <h1>Options</h1>
          </div>
        </header>
        <div class="field captcha-enable-field">
          <label class="toggle" for="captcha-enabled">
            <input type="checkbox" id="captcha-enabled">
            <span>Enable captcha code</span>
          </label>
          <p class="hint">When on, the settings above are locked behind the drawn code until the unlock timer runs out. Takes effect the next time the settings page opens.</p>
        </div>
        <div class="field">
          <label for="captcha-length">Captcha code length</label>
          <select id="captcha-length">
            <option value="32">32 characters</option>
            <option value="64">64 characters</option>
          </select>
        </div>
        <div class="field">
          <label for="unlock-minutes">Stay unlocked for</label>
          <select id="unlock-minutes">
            <option value="1">1 minute</option>
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="60">1 hour</option>
          </select>
        </div>
        <p class="note">
          Changes save immediately. Profiles you mark Active all apply at once: their channels are
          hidden on the home feed and search results, their channel pages are blocked, and their
          videos (including Shorts, if you tick it) redirect to a blocked page.
        </p>
      </section>
      </div>
      </div>
      </div>
    </template>

    <script src="../shared/matching.js"></script>
    <script src="../shared/profiles.js"></script>
    <script src="../shared/captcha.js"></script>
    <script src="options.js"></script>
  </body>
</html>
